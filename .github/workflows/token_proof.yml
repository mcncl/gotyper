name: Scoped GitHub token proof

on:
  pull_request:

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on this pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$GH_TOKEN"
          test -z "${GITHUB_TOKEN+x}"

          case "$GITHUB_REF" in
            refs/pull/*/merge|refs/pull/*/head)
              pr_ref="${GITHUB_REF#refs/pull/}"
              pr_number="${pr_ref%%/*}"
              ;;
            *)
              echo "Unexpected pull request ref: $GITHUB_REF" >&2
              exit 1
              ;;
          esac

          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]

          gh pr comment "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body "buildkite-gha scoped GitHub token proof passed"
