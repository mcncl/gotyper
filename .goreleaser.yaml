project_name: gotyper
version: 2

release:
  name_template: Gotyper {{.Version}}
  draft: true
  replace_existing_draft: true
  prerelease: auto
  make_latest: false
  mode: replace

changelog:
  use: github

builds:
  - id: macos
    goos: [darwin]
    goarch: [amd64, arm64]
    binary: gotyper
    main: .
    ldflags:
      - -s -w -X main.Version={{.Tag}}

  - id: linux
    goos: [linux]
    goarch: [arm, amd64, arm64]
    env:
      - CGO_ENABLED=0
    binary: gotyper
    main: .
    ldflags:
      - -s -w -X main.Version={{.Tag}}

  - id: windows
    goos: [windows]
    goarch: [amd64, arm64]
    binary: gotyper
    main: .
    ldflags:
      - -s -w -X main.Version={{.Tag}}

archives:
  - id: macos-archive
    ids: [macos]
    name_template: "gotyper_{{ .Version }}_macOS_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    wrap_in_directory: true
    formats: [zip]
    files:
      - LICENSE
      - README.md

  - id: linux-archive
    ids: [linux]
    name_template: "gotyper_{{ .Version }}_linux_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    wrap_in_directory: true
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

  - id: windows-archive
    ids: [windows]
    name_template: "gotyper_{{ .Version }}_windows_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    wrap_in_directory: false
    formats: [zip]
    files:
      - LICENSE
      - README.md

nfpms:
  - ids:
      - linux
    vendor: Gotyper
    homepage: https://github.com/mcncl/gotyper
    maintainer: Ben McNicholl <git@benmcnicholl.com>
    description: A command line interface for Gotyper.
    license: MIT
    formats:
      - apk
      - deb
      - rpm
    provides:
      - gotyper
