# GoTyper Configuration File
# Save as .gotyper.yml in your project root (searched in current and parent directories).
# Use one YAML document; unknown keys and unsupported settings return errors.
# Explicit --package, --root-name, and --format flags override these settings,
# even when set to CLI defaults. Omitted flags honor this file.
# Settings below apply to samples and JSON Schema unless noted otherwise.
# See docs/reference.md "Compatibility settings" for legacy defaults and no-ops.

# Default package name for generated structs
package: "models"

# Default root struct name when not specified
root_name: "ApiResponse"

# Code formatting options
formatting:
  enabled: true

# Type inference settings
types:
  # Use pointers for optional fields (null/missing).
  # false removes optional field pointers; nullable array elements and recursive
  # schema references can still require pointers.
  optional_as_pointers: true

  # Custom type mappings: first matching pattern wins, using the original key.
  # Mapped types must support decoding the supplied values.
  mappings:
    # Map fields containing "id" to specific types
    - pattern: ".*_id$|^id$"
      type: "int64"
      comment: "Primary/Foreign key IDs"
    
    # Keep email fields as strings with a field comment (no import needed)
    - pattern: ".*email.*"
      type: "string"
      comment: "Email address"
    
    # Map timestamp fields to time.Time (requires RFC3339 input or custom decoding)
    - pattern: ".*_at$|.*_time$|timestamp"
      type: "time.Time"
      import: "time"
      comment: "Timestamp field"
    
    # Map UUID fields
    - pattern: ".*uuid.*|.*guid.*"
      type: "uuid.UUID"
      import: "github.com/google/uuid"
      comment: "UUID field"

# Field naming conventions
naming:
  # Convert snake_case JSON keys to PascalCase Go field names
  pascal_case_fields: true

  # Custom field name mappings (takes precedence over pascal_case_fields)
  field_mappings:
    "user_id": "UserID"
    "api_key": "APIKey"
    "url": "URL"
    "http_status": "HTTPStatus"
    "oauth_token": "OAuthToken"

  # Custom plural to singular mappings for array element naming
  # Use this for domain-specific terms not in the built-in dictionary
  custom_singulars:
    "datums": "datum"        # Scientific term
    "formulae": "formula"    # Latin plural
    "stimuli": "stimulus"    # Psychology/biology term
    "alumni": "alumnus"      # Academic term

# JSON tag generation
json_tags:
  # Include omitempty for pointer fields
  omitempty_for_pointers: true
  
  # Include omitempty for slice fields
  omitempty_for_slices: true
  
  # Only yaml and xml are supported; json is always included.
  additional_tags:
    - "yaml"
    - "xml"

  # First matching pattern sets JSON options and an optional field comment.
  custom_options:
    - pattern: ".*password.*|.*secret.*"
      options: "-"
      comment: "Excluded from JSON"

  # Exact keys to omit entirely (unlike options: "-", which keeps the field)
  skip_fields:
    - "internal_use_only"
    - "debug_info"

# Validation tag generation
validation:
  # Controls configured rules only; schema-derived tags still appear by default.
  enabled: false
  # When enabled, the first matching rule replaces schema-derived validation.
  rules:
    - pattern: ".*email.*"
      tag: "validate:\"required,email\""
    
    - pattern: ".*_id$|^id$"
      tag: "validate:\"required,min=1\""
    
    - pattern: ".*password.*"
      tag: "validate:\"required,min=8\""

# Array handling
arrays:
  # Singularize array element type names (users -> User)
  singularize_names: true
